# Settings for the analytics engine (src/modeling). Read by src/modeling/train.py.

# Problem type: supervised. Regression (how much a country imports, log10 kg) and binary
# classification (major buyer or not) on the same rows. Not clustering: every row has a label.

data:
  years: [2023, 2024]          # the only years with imports from China in data1.xlsx
  feature_lag_years: 1         # 1: last year's power data, already published when a year starts,
                               # so the engine can forecast. 0: same-year data (only after the year ends)

target:
  column: imports_from_china_kg   # regression target, modelled as log10(kg)
  major_buyer_kg: 10000           # classification target: a major buyer imports >= 10 tonnes a year

features:                      # power-sector data only (data2.xlsx): known without any trade data
  size:                        # skewed: log10 inside the pipeline
    - wind_capacity_gw
    - wind_generation_twh
    - solar_capacity_gw
    - total_generation_twh
    - demand_twh
  other:
    - renewables_share_pct
    - emissions_intensity_g_per_kwh
    - year
  forbidden:                   # never features: they come from the same trade records as the target
    - imports_from_china_value_kusd
    - import_growth_pct
  availability:                # when each feature is known at prediction time (checked by a test)
    wind_capacity_gw: Ember yearly data, published after the year ends; every country
    wind_generation_twh: Ember yearly data, published after the year ends; every country
    solar_capacity_gw: Ember yearly data, published after the year ends; a few countries missing (median-filled)
    total_generation_twh: Ember yearly data, published after the year ends; every country
    demand_twh: Ember yearly data, published after the year ends; every country
    renewables_share_pct: Ember yearly data, published after the year ends; every country
    emissions_intensity_g_per_kwh: Ember yearly data, published after the year ends; every country
    year: known in advance

costs:                         # business cost of each classification error, relative (analyst's judgement)
  false_negative: 3            # a missed major buyer: a market of 10 t+ a year left unworked
  false_positive: 1            # a smaller buyer flagged as major: one wasted sales or sourcing effort

actions:                       # turning predictions into a recommendation (predict.recommend)
  far_above: 10                # actual / expected above this: buys far more than its power sector explains
  far_below: 0.1               # below this, with a major-buyer profile: under-served

split:
  test_share: 0.25             # whole countries held out as the test set
  cv_folds: 5                  # GroupKFold by country, inside the training set
  random_state: 42

tuning:                        # grid-searched inside cross-validation (never on the test set)
  regression:
    ridge:
      model__alpha: [0.01, 0.1, 1, 10, 100]
    random_forest:
      model__max_depth: [2, 3, 5, null]
      model__min_samples_leaf: [1, 3, 5]
  classification:
    logistic:
      model__C: [0.001, 0.01, 0.1, 1, 10]
    random_forest:
      model__max_depth: [2, 3, 5, null]
      model__min_samples_leaf: [1, 3, 5]

output:
  model_path: models/rare_earth_engine.joblib   # git-ignored (*.joblib)
